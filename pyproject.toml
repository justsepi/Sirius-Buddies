[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mansion"
version = "0.1.0"
description = "Sirius & the Mansion — Cross-platform retro CLI cyber-buddy hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sirius = "mansion.cli:main"
mansion = "mansion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mansion.buddies" = ["souls/*.md"]
