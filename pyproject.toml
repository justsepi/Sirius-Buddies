[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "castle"
version = "1.0.0b0"
description = "Sirius & the Castle — Cross-platform retro CLI cyber-buddy hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sirius = "castle.cli:main"
castle = "castle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"castle.buddies" = ["souls/*.md"]
